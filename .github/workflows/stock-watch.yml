name: Arc'teryx stock watch

# Public repo, so Actions minutes are free: a 15 minute cadence is fine.
# GitHub may delay scheduled runs under load, and disables the schedule
# entirely after 60 days with no commits to the repository.
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Also send a test notification, to confirm the channels work"
        type: boolean
        default: false
      rehearse_size:
        description: "Also check this size for real and alert on it, e.g. 4R -- a full dress rehearsal"
        type: string
        default: ""

  schedule:
    - cron: "*/15 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BARK_URL: ${{ secrets.BARK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Caching the browser turns a ~2min install into a few seconds, so a
      # restock is noticed sooner.
      - name: Cache chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Without this every run starts blank and would re-alert while the
      # size stays in stock. Cache keys are immutable, so write a fresh one
      # each run and restore the most recent by prefix.
      - name: Restore previous stock state
        uses: actions/cache/restore@v4
        with:
          path: stock_state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Send a test notification
        if: ${{ inputs.test_email }}
        run: python check_stock.py --test-notify

      - name: Rehearse an in-stock alert
        if: ${{ inputs.rehearse_size != '' }}
        run: |
          python check_stock.py --size "${{ inputs.rehearse_size }}" \
            --notify-always --state-file rehearsal_state.json

      - name: Check stock
        # Each run starts from a clean checkout, so there is no previous state
        # to compare against -- notify on every in-stock result.
        # 0 in stock, 1 out of stock: both are successful checks, so the
        # step must not die on exit 1 the way `bash -e` would. Exit 2
        # (detection broke) is left to fail the run on purpose.
        id: check
        run: |
          set +e
          python check_stock.py --screenshot shot.png | tee run.log
          code=${PIPESTATUS[0]}
          set -e
          case "$code" in
            0) verdict="IN STOCK" ;;
            1) verdict="out of stock" ;;
            *) verdict="UNDETERMINED - detection needs attention" ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          # Also as a slug, so the artifact name carries the answer and the
          # result is visible on the run page without opening the log.
          case "$code" in
            0) echo "slug=IN-STOCK" >> "$GITHUB_OUTPUT" ;;
            1) echo "slug=out-of-stock" >> "$GITHUB_OUTPUT" ;;
            *) echo "slug=UNDETERMINED" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "$code" -le 1 ]; then exit 0; else exit "$code"; fi

      - name: Report the verdict
        if: always()
        run: |
          echo "## 00S (Sea Salt): ${{ steps.check.outputs.verdict }}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ''
            echo '```'
            grep -E '00S ->|emailed|notified|page colour' run.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "=== VERDICT: ${{ steps.check.outputs.verdict }} ==="
          grep -E '00S ->|emailed|notified' run.log || true

      - name: Save stock state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stock_state.json
          key: stock-state-${{ github.run_id }}

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ steps.check.outputs.slug }}
          path: shot.png
          if-no-files-found: ignore
